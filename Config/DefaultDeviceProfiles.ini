; SCB2 — Windows device profile. The AUTHORITATIVE home for the 8 GB-safe render budget.
;
; Why a DeviceProfile and not just DefaultEngine.ini: the project ships at the "Maximum/Epic"
; scalability tier, and that tier RE-APPLIES r.Streaming.LimitPoolSizeToVRAM=0 (unclamped pool)
; on every quality/resolution/auto-detect event — stomping any plain [ConsoleVariables] line.
; DeviceProfile CVars are applied ABOVE scalability, so these values hold no matter what.
;
; Target hardware: RTX 5070 Laptop GPU = 8 GB (process budget ~7.1 GB). Goal: peak resident VRAM
; <= ~6.5 GB with ~1.5-2 GB headroom, GPU-driven, no "D3D device removed" overcommit.
; The game ALWAYS runs on the GPU; nothing here moves rendering to the CPU.
;
; The profile name MUST be exactly "Windows" or it silently never applies (confirm
; "Active device profile: [Windows]" in the log).

[/Script/Engine.DeviceProfileManager]
+DeviceProfiles=(DeviceType="Windows",Name="Windows")

[Windows DeviceProfile]
; --- VRAM safety: clamp the texture streaming pool so it can NEVER overcommit (the crash fix) ---
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.Streaming.PoolSize=1800
; --- Smoothness (Adam: framerate HITCHES during fast movement; keep the speed, make it keep up) ---
; More resident textures (1800 vs 1400, still VRAM-clamped) = less streaming churn; stream FASTER and
; refresh priorities sooner so the streamer keeps up with the hero instead of hitching/popping in.
+CVars=r.Streaming.Boost=2
+CVars=r.Streaming.FramesForFullUpdate=2
+CVars=r.Streaming.MaxNumTexturesToStreamPerFrame=0
; --- SOFTWARE Lumen (RT OFF) ---
; Hardware-RT Lumen HUNG the 8 GB GPU within 15 s of live 1080p rendering (the RT acceleration
; structure for this dense scene is the budget-buster). Software Lumen keeps dynamic GI +
; reflections but traces mesh distance fields instead of a ray-tracing BVH: no RT scene, no
; hang, big VRAM cut. Trade-off vs the hybrid: mirror-smooth reflections are slightly softer
; (rain-wet neon hides it). r.DynamicGlobalIlluminationMethod / r.ReflectionMethod stay =1 (Lumen).
+CVars=r.RayTracing=False
+CVars=r.Lumen.HardwareRayTracing=False
+CVars=r.Lumen.Reflections.HardwareRayTracing=False
; No RT BVH kept resident — the pool is moot with RT off.
+CVars=r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=0
; --- DLSS 4.5 (installed 2026-07-21, plugin v8.7.0, engine-level) + 67% render scale ---
; DLSS Super Resolution replaces TSR as the upscaler when active; it reads the same
; r.ScreenPercentage, so 67 = DLSS "Quality" mode (2560x1600 -> ~1707x1067 internal).
; If DLSS ever fails to initialize (driver issue etc.), TSR silently takes over at the
; same 67% — the game stays fast either way. Tensor-core upscale costs ~0 VRAM extra.
+CVars=r.ScreenPercentage=67
+CVars=r.NGX.DLSS.Enable=1
; Frame Generation (2x): AI-generated in-between frames; needs Windows HW-accelerated
; GPU scheduling ON — if unsupported it no-ops harmlessly. Reflex keeps latency low.
+CVars=r.Streamline.DLSSG.Enable=1
+CVars=r.Streamline.DLSSG.FramesToGenerate=1
+CVars=t.Streamline.Reflex.Mode=1
; --- Right-sized sampling / shadows (keeps the neon look, trims VRAM + GPU time) ---
+CVars=r.Lumen.FinalGather.SampleResolutionScale=1.0
+CVars=r.Lumen.Reflections.SampleResolutionScale=1.0
+CVars=r.Lumen.Reflections.MaxRoughnessToTrace=0.5
+CVars=r.Shadow.Virtual.SMRT.RayCountLocal=8
+CVars=r.Shadow.Virtual.SMRT.RayCountDirectional=8
