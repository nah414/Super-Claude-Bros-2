; SCB2 — Windows device profile. The AUTHORITATIVE home for the 8 GB-safe render budget.
;
; Why a DeviceProfile and not just DefaultEngine.ini: the project ships at the "Maximum/Epic"
; scalability tier, and that tier RE-APPLIES r.Streaming.LimitPoolSizeToVRAM=0 (unclamped pool)
; on every quality/resolution/auto-detect event — stomping any plain [ConsoleVariables] line.
; DeviceProfile CVars are applied ABOVE scalability, so these values hold no matter what.
;
; Target hardware: RTX 5070 Laptop GPU = 8 GB (process budget ~7.1 GB). Goal: peak resident VRAM
; <= ~6.5 GB with ~1.5-2 GB headroom, GPU-driven, no "D3D device removed" overcommit.
; The game ALWAYS runs on the GPU; nothing here moves rendering to the CPU.
;
; The profile name MUST be exactly "Windows" or it silently never applies (confirm
; "Active device profile: [Windows]" in the log).

[/Script/Engine.DeviceProfileManager]
+DeviceProfiles=(DeviceType="Windows",Name="Windows")

[Windows DeviceProfile]
; --- VRAM safety: clamp the texture streaming pool so it can NEVER overcommit (the crash fix) ---
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.Streaming.PoolSize=1400
; --- Hybrid Lumen: software-cache GI + HARDWARE-RT reflections (Adam's pick) ---
; LightingMode=1 = "Hit Lighting for Reflections": reflection rays use the RT cores (sharp),
; while GI rides the cheaper Lumen surface cache. Keeps RayTracing on for the reflection BVH.
+CVars=r.RayTracing=True
+CVars=r.Lumen.HardwareRayTracing=True
+CVars=r.Lumen.HardwareRayTracing.LightingMode=1
+CVars=r.Lumen.Reflections.HardwareRayTracing=True
; RT resident-geometry pool (the reflection BVH): 640 MB, down from the desktop-sized 1800 MB.
+CVars=r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=640
; --- Right-sized sampling / shadows (keeps the neon look, trims VRAM + GPU time) ---
+CVars=r.Lumen.FinalGather.SampleResolutionScale=1.0
+CVars=r.Lumen.Reflections.SampleResolutionScale=1.0
+CVars=r.Lumen.Reflections.MaxRoughnessToTrace=0.5
+CVars=r.Shadow.Virtual.SMRT.RayCountLocal=8
+CVars=r.Shadow.Virtual.SMRT.RayCountDirectional=8
