[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
; Motion blur OFF by default — it smeared the big bosses' fast limbs into streaks
; (worsened when the framerate dipped under multi-boss load). Crisp motion instead.
r.DefaultFeature.MotionBlur=False
; ---- 8 GB RTX 5070 Laptop: SOFTWARE Lumen (hardware RT hung the GPU at 1080p) ----
; Lumen GI + reflections stay on (r.DynamicGlobalIlluminationMethod/r.ReflectionMethod=1 above),
; but trace mesh distance fields, not a ray-tracing BVH. Authoritative copy in DefaultDeviceProfiles.ini.
r.SkinCache.CompileShaders=True
; MOTION-VECTOR LAW (July 23 research): TSR needs skinned velocity or characters
; ghost (gliding legs, hand afterimages). Skin cache ON explicitly — a silent
; fallback to the non-cache path can drop the pass-through velocity.
r.SkinCache.Mode=1
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
r.Lumen.Reflections.HardwareRayTracing=False
r.MegaLights.EnabledByDefault=True
r.MaxAnisotropy=16

[ConsoleVariables]
; 8 GB-safe render budget (RTX 5070 Laptop). The AUTHORITATIVE copy lives in
; Config/DefaultDeviceProfiles.ini ([Windows DeviceProfile]) because the Epic scalability tier
; re-stomps r.Streaming.LimitPoolSizeToVRAM; these lines keep the cooked default in agreement.
; Hybrid Lumen: software-cache GI + hardware-RT reflections (LightingMode=1). See that file.
r.Lumen.FinalGather.SampleResolutionScale=1.0
r.Lumen.Reflections.SampleResolutionScale=1.0
r.Lumen.Reflections.MaxRoughnessToTrace=0.5
r.MegaLights.Enabled=1
r.Tonemapper.Sharpen=0.4
r.Shadow.Virtual.SMRT.RayCountLocal=8
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.VolumetricFog.TemporalReprojection=1
; Clamp the streaming pool to available VRAM so it can never overcommit the 8 GB card.
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1800
; Stream faster + keep more resident so fast movement doesn't hitch (authoritative copy in DeviceProfile).
r.Streaming.Boost=2
r.Streaming.FramesForFullUpdate=2
r.Streaming.MaxNumTexturesToStreamPerFrame=0
; RT off (software Lumen) -> no resident BVH pool needed.
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=0

